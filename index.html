<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finanzas YJ</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="ffp">


<div id="auth">
  <div class="lg-wrap">
    <div class="lg-avatar"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#fff" stroke-width="1.2"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.7 3.8-7.5 8.5-7.5s8.5 2.8 8.5 7.5z"/></svg></div>
    <div class="lg-card">
      <div class="lg-field"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span><input id="email" type="email" placeholder="Correo electrónico"></div>
      <div class="lg-field"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="#fff"><path d="M6 10V8a6 6 0 0 1 12 0v2h1.5v12h-15V10zm2.5 0h7V8a3.5 3.5 0 0 0-7 0z"/></svg></span><input id="pass" type="password" placeholder="Contraseña"></div>
      <div class="lg-row"><label><input type="checkbox" id="remember" checked> Recordarme</label><a href="#" id="forgot">¿Olvidaste tu contraseña?</a></div>
      <p id="authErr" class="err"></p>
    </div>
    <button id="btnLogin" class="lg-btn">INGRESAR</button>
    <a href="#" id="btnReg" class="lg-reg">¿No tienes cuenta? <b>Regístrate</b></a>
  </div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <h2>-Dashboard- Finanzas</h2>
    <div>Año <input id="anio" type="number" value="2026" style="width:80px">
    Mes <select id="mes"></select>
    Moneda <input id="mon" value="$" style="width:40px">
    <label class="sw"><input type="checkbox" id="usePres" checked> Usar presupuesto</label>
    <button id="btnXls" class="xl">Exportar a Excel</button>
    <span id="who"></span> <button id="btnOut" class="sec">Salir</button></div>
  </div>
  <p id="err" class="err"></p>
  <div class="kpis" id="kpis"></div>
  <div class="charts">
    <div class="card"><canvas id="c1"></canvas></div>
    <div class="card"><canvas id="c2"></canvas></div>
    <div class="card cp"><canvas id="c3"></canvas></div>
  </div>
  <details class="card" id="cpBox"><summary><b>Copiar de otro mes</b></summary>
    <p>Copiar desde <select id="cpSrc"></select> hacia <b id="cpDest"></b> (el mes elegido arriba).</p>
    <div id="cpSecs"></div>
    <p><label class="sw"><input type="checkbox" id="cpActual"> Copiar también los montos actuales (si no, solo el presupuesto)</label></p>
    <button id="btnCopy">Copiar</button> <span id="cpMsg"></span>
  </details>
  <div class="grid" id="grid"></div>
  <div class="grid">
    <div class="card"><h3>Presupuesto 50/30/20</h3><div id="rule"></div></div>
    <div class="card"><h3>Resumen por categoría</h3><table id="resumen"></table></div>
  </div>
  <div class="grid">
    <div class="card"><h3>Tendencia del ahorro</h3><canvas id="c5" style="max-height:300px"></canvas></div>
    <div class="card"><h3>Metas de ahorro</h3><div id="metas"></div>
      <div class="add"><input type="text" id="m_nombre" placeholder="Meta (ej. Viaje)">
        <input type="number" id="m_obj" step="0.01" placeholder="Objetivo">
        <input type="number" id="m_ini" step="0.01" placeholder="Ya ahorrado">
        <button id="btnMeta">Agregar meta</button></div>
      <p id="metaErr" class="err"></p></div>
  </div>
  <div class="card"><h3>Resumen anual</h3><div style="overflow-x:auto"><table id="anual"></table></div><canvas id="c4" style="max-height:300px"></canvas></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</div>
<script type="module" src="app.js"></script>
</body></html>
